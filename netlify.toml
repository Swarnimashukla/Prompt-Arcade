# Deploy configuration for promptarcade.netlify.app
#
# The site is static and has no build step. The publish directory is
# `public/`, deliberately NOT the repository root: `rubrics/` sits
# outside it so scoring patterns and reference answers are never served
# to a browser. They reach the scoring function through included_files
# instead.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Bundles the rubrics with the functions. This is how they stay
  # readable server-side while being unreachable over HTTP.
  included_files = ["rubrics/**"]
  node_bundler = "esbuild"

# Friendly paths for the scoring API.
[[redirects]]
  from = "/api/brief"
  to = "/.netlify/functions/brief"
  status = 200

[[redirects]]
  from = "/api/score"
  to = "/.netlify/functions/score"
  status = 200

# Belt and braces: even if rubrics were ever copied into the publish
# directory by mistake, this path does not resolve.
[[redirects]]
  from = "/rubrics/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Scenario listings ship with each release and are fetched at runtime.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
